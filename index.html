            const match = zhuyinStr.match(toneRegex);
            const tone = match ? match[0] : ''; 
            const symbols = zhuyinStr.replace(toneRegex, '').trim(); 
            return { symbols, tone };
        };

        const App = () => {
            const [sheetTitle, setSheetTitle] = useState("國語圈詞練習單");
            const [inputLines, setInputLines] = useState(DEFAULT_WORDS.join('\n'));
            const [wordsData, setWordsData] = useState([]);
            const [fontSize, setFontSize] = useState(34);
            const [itemsPerRow, setItemsPerRow] = useState(6);
            const [showSettings, setShowSettings] = useState(true);

            useEffect(() => {
                const lines = inputLines.split('\n').filter(line => line.trim() !== '');
                
                setWordsData(prevData => {
                    let newWordsData = [];
                    lines.forEach((line, colIndex) => {
                        let lineZhuyins = [];
                        
                        // 1. 先檢查整詞是否有破音字修正
                        let polyphonicMatch = false;
                        for (const [key, val] of Object.entries(POLYPHONIC_FIX)) {
                            if (line.includes(key)) {
                                // 簡單處理：如果整行就是這個詞 (或是包含)，這裡做簡單替換
                                // 為了精確，我們假設每個詞獨立一行最好
                                // 這裡只做最簡單的整行匹配，若複雜句子需更強邏輯
                                if (line === key) {
                                    lineZhuyins = val;
                                    polyphonicMatch = true;
                                    break;
                                }
                            }
                        }

                        // 2. 逐字查詢
                        if (!polyphonicMatch) {
                            lineZhuyins = line.split('').map(char => {
                                // 優先查內建字庫
                                return ZHUYIN_MAP.get(char) || '';
                            });
                        }

                        const chars = line.split('');
                        const colData = chars.map((char, charIndex) => {
                            const existingLine = prevData[colIndex];
                            const existingChar = existingLine && existingLine.chars[charIndex];
                            
                            let zhuyin = lineZhuyins[charIndex] || '';
                            let isCharHidden = false;
                            let isZhuyinHidden = false;
                            let customZhuyin = false;

                            // 保留使用者手動修改
                            if (existingChar && existingChar.char === char) {
                                isCharHidden = existingChar.isCharHidden;
                                isZhuyinHidden = existingChar.isZhuyinHidden;
                                if (existingChar.customZhuyin) {
                                    zhuyin = existingChar.zhuyin;
                                    customZhuyin = true;
                                }
                            }

                            return {
                                id: `c-${colIndex}-${charIndex}`,
                                char,
                                zhuyin,
                                isCharHidden,
                                isZhuyinHidden,
                                customZhuyin
                            };
                        });

                        newWordsData.push({ id: `line-${colIndex}`, chars: colData });
                    });
                    return newWordsData;
                });
            }, [inputLines]);

            const handlePrint = () => window.print();

            const setGlobalMode = (mode) => {
                setWordsData(prev => prev.map(line => ({
                    ...line,
                    chars: line.chars.map(c => ({
                        ...c,
                        isCharHidden: mode === 'hideChar',
                        isZhuyinHidden: mode === 'hideZhuyin'
                    }))
                })));
            };

            const toggleCharHide = (lineIndex, charIndex) => {
                setWordsData(prev => {
                    const newData = [...prev];
                    newData[lineIndex].chars[charIndex].isCharHidden = !newData[lineIndex].chars[charIndex].isCharHidden;
                    return newData;
                });
            };

            const toggleZhuyinHide = (lineIndex, charIndex) => {
                setWordsData(prev => {
                    const newData = [...prev];
                    newData[lineIndex].chars[charIndex].isZhuyinHidden = !newData[lineIndex].chars[charIndex].isZhuyinHidden;
                    return newData;
                });
            };

            const updateZhuyin = (lineIndex, charIndex, newZhuyin) => {
                setWordsData(prev => {
                    const newData = [...prev];
                    newData[lineIndex].chars[charIndex].zhuyin = newZhuyin;
                    newData[lineIndex].chars[charIndex].isZhuyinHidden = false;
                    newData[lineIndex].chars[charIndex].customZhuyin = true;
                    return newData;
                });
            };

            const section1 = wordsData.slice(0, itemsPerRow);
            const section2 = wordsData.slice(itemsPerRow, itemsPerRow * 2);
            const section3 = wordsData.slice(itemsPerRow * 2, itemsPerRow * 3);

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    <div className="flex-1 p-4 md:p-8 overflow-auto flex justify-center bg-gray-100 print:bg-white print:p-0">
                        <div className="bg-white shadow-lg relative box-border flex overflow-hidden print-container"
                             style={{ width: '210mm', height: '297mm', padding: '10mm', position: 'relative' }}>
                            
                            <div className="title-section border-l-2 border-black flex flex-col items-center pt-8 flex-shrink-0 bg-white"
                                 style={{ position: 'absolute', right: '10mm', top: '10mm', bottom: '10mm', width: '90px', writingMode: 'vertical-rl', zIndex: 50 }}>
                                <h1 className="text-3xl font-bold tracking-[0.2em] font-serif mb-12 text-center whitespace-nowrap">{sheetTitle}</h1>
                                <div className="flex gap-4 text-base font-medium tracking-widest justify-center w-full">
                                    <div className="flex items-center pt-4 gap-2"><span>班級</span><span className="border-l border-black h-20 block"></span></div>
                                    <div className="flex items-center pt-4 gap-2"><span>座號</span><span className="border-l border-black h-16 block"></span></div>
                                    <div className="flex items-center pt-4 gap-2"><span>姓名</span><span className="border-l border-black h-24 block"></span></div>
                                    <div className="flex items-center pt-4 gap-2"><span>得分</span><span className="border-l border-black h-16 block"></span></div>
                                </div>
                                <div className="mt-auto mb-4 text-xs text-gray-400 tracking-widest no-print">國語圈詞練習</div>
                            </div>

                            <div className="flex-1 flex flex-col h-full" style={{ marginRight: '100px' }}>
                                <div className="flex-1 border-b-2 border-dashed border-gray-300 flex items-start justify-end">
                                    <div className="w-full h-full flex flex-row-reverse flex-wrap content-start items-start gap-y-4 px-2 pt-4">
                                        {section1.map((line, idx) => (
                                            <QuestionItem key={line.id} line={line} index={idx} fontSize={fontSize}
                                                onToggleChar={(cIdx) => toggleCharHide(idx, cIdx)}
                                                onToggleZhuyin={(cIdx) => toggleZhuyinHide(idx, cIdx)}
                                                onUpdateZhuyin={(cIdx, val) => updateZhuyin(idx, cIdx, val)} />
                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 border-b-2 border-dashed border-gray-300 flex items-start justify-end">
                                    <div className="w-full h-full flex flex-row-reverse flex-wrap content-start items-start gap-y-4 px-2 pt-4">
                                        {section2.map((line, idx) => (
                                            <QuestionItem key={line.id} line={line} index={idx + itemsPerRow} fontSize={fontSize}
                                                onToggleChar={(cIdx) => toggleCharHide(idx + itemsPerRow, cIdx)}
                                                onToggleZhuyin={(cIdx) => toggleZhuyinHide(idx + itemsPerRow, cIdx)}
                                                onUpdateZhuyin={(cIdx, val) => updateZhuyin(idx + itemsPerRow, cIdx, val)} />
                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 flex items-start justify-end">
                                    <div className="w-full h-full flex flex-row-reverse flex-wrap content-start items-start gap-y-4 px-2 pt-4">
                                        {section3.map((line, idx) => (
                                            <QuestionItem key={line.id} line={line} index={idx + itemsPerRow * 2} fontSize={fontSize}
                                                onToggleChar={(cIdx) => toggleCharHide(idx + itemsPerRow * 2, cIdx)}
                                                onToggleZhuyin={(cIdx) => toggleZhuyinHide(idx + itemsPerRow * 2, cIdx)}
                                                onUpdateZhuyin={(cIdx, val) => updateZhuyin(idx + itemsPerRow * 2, cIdx, val)} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className={`bg-slate-900 text-white w-full md:w-80 flex-shrink-0 p-5 flex flex-col gap-4 no-print transition-all duration-300 z-20 overflow-y-auto h-screen md:h-auto ${!showSettings ? 'hidden' : ''}`}>
                        <div className="flex items-center justify-between border-b border-slate-700 pb-3">
                            <h2 className="text-lg font-bold flex items-center gap-2"><IconSettings /> 出題設定</h2>
                        </div>
                        <div className="bg-slate-800 p-3 rounded text-sm space-y-2 border border-slate-700">
                            <p className="text-green-400 font-bold">✅ 內建字庫版</p>
                            <p className="text-xs text-slate-300">完全不需連網，支援國小常用字。</p>
                        </div>
                        <div className="space-y-1 flex-1 flex flex-col min-h-[150px]">
                            <label className="text-sm text-slate-400">輸入詞彙</label>
                            <textarea className="w-full flex-1 bg-slate-800 border-slate-700 border rounded p-2 text-white outline-none font-mono text-lg tracking-wider resize-none"
                                value={inputLines} onChange={(e) => setInputLines(e.target.value)} placeholder="例如：銀行、快樂" />
                        </div>
                        <div className="space-y-1"><label className="text-sm text-slate-400">標題</label><input type="text" value={sheetTitle} onChange={(e) => setSheetTitle(e.target.value)} className="w-full bg-slate-800 border-slate-700 border rounded p-2 text-white outline-none" /></div>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="space-y-1"><div className="flex justify-between text-xs text-slate-400"><span>字體</span><span>{fontSize}</span></div><input type="range" min="24" max="48" step="2" value={fontSize} onChange={(e) => setFontSize(parseInt(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg accent-blue-500" /></div>
                            <div className="space-y-1"><div className="flex justify-between text-xs text-slate-400"><span>每列題數</span><span>{itemsPerRow}</span></div><input type="range" min="4" max="8" step="1" value={itemsPerRow} onChange={(e) => setItemsPerRow(parseInt(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg accent-blue-500" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2 pt-2">
                            <button onClick={() => setGlobalMode('hideZhuyin')} className="bg-slate-800 hover:bg-blue-600 p-2 rounded text-sm flex items-center justify-center gap-1 border border-slate-700"><IconEraser /> 挖空注音</button>
                            <button onClick={() => setGlobalMode('hideChar')} className="bg-slate-800 hover:bg-blue-600 p-2 rounded text-sm flex items-center justify-center gap-1 border border-slate-700"><IconType /> 挖空國字</button>
                            <button onClick={() => setGlobalMode('normal')} className="col-span-2 bg-slate-800 hover:bg-green-600 p-2 rounded text-sm flex items-center justify-center gap-1 border border-slate-700"><IconRefresh /> 全部顯示</button>
                        </div>
                        <button onClick={handlePrint} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow flex items-center justify-center gap-2 mb-8 md:mb-0"><IconPrinter /> 列印 / PDF</button>
                    </div>
                    <button className="fixed bottom-4 right-4 bg-slate-900 text-white p-3 rounded-full shadow-lg md:hidden no-print z-30" onClick={() => setShowSettings(!showSettings)}><IconSettings /></button>
                </div>
            );
        };

        const QuestionItem = ({ line, index, fontSize, onToggleChar, onToggleZhuyin, onUpdateZhuyin }) => {
            return (
                <div className="flex flex-col items-center gap-2 px-2" style={{ flex: '0 0 auto', minWidth: '14%' }}>
                    <div className="w-6 h-6 rounded-full border border-black flex items-center justify-center text-xs font-mono font-bold mb-1">{index + 1}</div>
                    <div className="flex flex-col items-center gap-1">
                        {line.chars.map((charData, cIdx) => (
                            <WordBlock key={charData.id} data={charData} fontSize={fontSize}
                                onToggleChar={() => onToggleChar(cIdx)} onToggleZhuyin={() => onToggleZhuyin(cIdx)} onUpdateZhuyin={(val) => onUpdateZhuyin(cIdx, val)} />
                        ))}
                    </div>
                </div>
            )
        }

        const ZhuyinDisplay = ({ zhuyinStr, isHidden, fontSize }) => {
            const { symbols, tone } = parseZhuyin(zhuyinStr);
            const isNeutralTone = tone === '˙';
            return (
                <div className={`relative flex flex-col items-center justify-center h-full w-full ${isHidden ? 'invisible' : 'visible'}`}>
                    {isNeutralTone && <span className="absolute -top-[0.4em] left-1/2 -translate-x-1/2 font-bold scale-75">˙</span>}
                    <div className="flex flex-col items-center leading-none justify-center h-full zhuyin-font">
                        {symbols.split('').map((s, i) => <span key={i} className="transform scale-y-110 block" style={{ height: '0.9em' }}>{s}</span>)}
                    </div>
                    {!isNeutralTone && tone && <span className="absolute -right-[0.5em] top-1/2 -translate-y-1/2 font-bold scale-90">{tone}</span>}
                </div>
            );
        };

        const WordBlock = ({ data, fontSize, onToggleChar, onToggleZhuyin, onUpdateZhuyin }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [tempZhuyin, setTempZhuyin] = useState(data.zhuyin);
            const inputRef = useRef(null);
            const handleZhuyinClick = (e) => { e.stopPropagation(); onToggleZhuyin(); };
            const handleZhuyinDoubleClick = (e) => { e.stopPropagation(); setTempZhuyin(data.zhuyin); setIsEditing(true); setTimeout(() => inputRef.current?.focus(), 10); };
            const handleBlur = () => { setIsEditing(false); onUpdateZhuyin(tempZhuyin); };
            const handleKeyDown = (e) => { if (e.key === 'Enter') handleBlur(); };

            return (
                <div className="flex border border-transparent" style={{ fontSize: `${fontSize}px`, width: `${fontSize * 1.5}px`, height: `${fontSize * 1.4}px` }}>
                    <div onClick={onToggleChar} className={`flex justify-center items-center border border-black cursor-pointer hover:bg-gray-50 transition-colors ${data.isCharHidden ? 'text-transparent' : 'text-black'}`} style={{ flex: 1, lineHeight: 1 }}>{data.char}</div>
                    <div className={`flex justify-center items-center select-none cursor-pointer hover:bg-blue-50 transition-colors relative ${data.isZhuyinHidden ? 'border border-gray-400 rounded-sm' : ''}`} style={{ width: '35%', fontSize: '0.4em' }} onClick={handleZhuyinClick} onDoubleClick={handleZhuyinDoubleClick}>
                        {isEditing ? (
                            <input ref={inputRef} value={tempZhuyin} onChange={(e) => setTempZhuyin(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} className="w-full h-full text-center bg-yellow-100 outline-none p-0 m-0 border-none absolute top-0 left-0" style={{ fontSize: '12px' }} onClick={(e) => e.stopPropagation()} />
                        ) : ( <ZhuyinDisplay zhuyinStr={data.zhuyin} isHidden={data.isZhuyinHidden} fontSize={fontSize} /> )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);             
    </script>
</body>
</html>
